<html lang="en">
<head>

<!-- ====== PREMIUM CINEMATIC THEME ====== -->
<style>
  :root{
    --bg:#060815;
    --ink:#E8ECFF;
    --muted:#9BA4C7;
    --card:#0B0F25;
    --edge:#1a2142;
    --accent:#8B5CF6; /* purple */
    --accent2:#06B6D4; /* cyan */
    --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family: ui-sans-serif, system-ui, Segoe UI, Roboto, Arial, sans-serif; 
    background: radial-gradient(120% 70% at 50% -10%, #142042 0, #0a0f25 45%, #060815 70%);
    overflow-x:hidden;
  }
  /* Animated nebula + gradient beams */
  .beam{
    position:fixed; inset:-20vmax; pointer-events:none; filter: blur(60px) saturate(150%);
    background:
      radial-gradient(40vmax 30vmax at 15% 10%, #1d4ed880 0, transparent 60%),
      radial-gradient(40vmax 30vmax at 85% 20%, #8b5cf680 0, transparent 60%),
      radial-gradient(35vmax 30vmax at 50% 85%, #06b6d470 0, transparent 60%);
    animation: float 16s ease-in-out infinite alternate;
    opacity:.55;
  }
  @keyframes float{ from{transform:translateY(-2vmax)} to{transform:translateY(2vmax)} }

  .wrap{max-width:980px;margin:0 auto;padding:18px}
  .titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}
  .brand{display:flex;align-items:center;gap:10px}
  .gem{width:22px;height:22px;border-radius:6px;
    background: conic-gradient(from 200deg, var(--accent), var(--accent2), #22d3ee, var(--accent));
    box-shadow: 0 0 14px #22d3ee40 inset, 0 0 14px #22d3ee50; }
  h1{margin:0;font-size:clamp(22px,4.8vw,40px);font-weight:900;letter-spacing:.02em}
  .sub{color:var(--muted)}

  .glass{
    background: linear-gradient(180deg, #0b122aEE, #0a1022EE);
    border:1px solid var(--edge); border-radius:22px; box-shadow: 0 25px 80px #0007;
  }
  .pad{padding:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stack{display:grid;gap:12px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  input[type=text]{
    width:100%;padding:14px 16px;border-radius:14px;border:1px solid #23305a;background:#0a1024;color:var(--ink);outline:none
  }
  button{cursor:pointer;border:none;border-radius:14px;padding:12px 16px;font-weight:800}
  .btn{
    color:white;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 28px #06b6d44a, inset 0 -2px 0 #ffffff22;
  }
  .btn.outline{background:#0a1020;border:1px solid #2a3869;color:var(--ink)}
  .pill{font-size:12px;padding:6px 10px;border-radius:999px;background:#0b1226;border:1px solid #25325e}
  .muted{color:var(--muted)}
  .center{display:grid;place-items:center;text-align:center}

  /* Question card with images */
  .q{display:grid;gap:12px}
  .q h3{margin:0 0 6px;font-size:20px}
  .opt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{
    display:grid; gap:8px; border:1.6px solid #26325f; border-radius:16px; overflow:hidden;
    background:#0b1230; transform:translateZ(0);
  }
  .choice img{width:100%;height:160px;object-fit:cover;display:block;filter:saturate(1.12) contrast(1.02)}
  .cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
  .cap .l{font-weight:800}
  .cap .r{opacity:.9;font-size:13px}
  .badge{font-size:13px;padding:4px 8px;border-radius:999px;background:#0a1024;border:1px solid #2b396b}
  .sel{outline:2px solid var(--accent2); box-shadow: 0 0 0 4px #22d3ee25 inset}

  .score{font-size:46px;font-weight:900}
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}

  .list{margin-top:12px;border-top:1px solid var(--edge)}
  .li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #121c3a}
  .tag{background:#0a1026;border:1px solid #223055;border-radius:999px;padding:4px 10px}

  /* subtle entrance */
  .fade{animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (max-width:720px){
    .grid,.opt{grid-template-columns:1fr}
    .choice img{height:180px}
  }
</style>
</head>

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,a={},c=[])=>{const n=document.createElement(t);Object.entries(a).forEach(([k,v])=>v!=null&&(n[k]=v));c.forEach(x=>n.appendChild(typeof x==="string"?document.createTextNode(x):x));return n};
const copy = async (txt)=>{try{await navigator.clipboard.writeText(txt);alert("Link copied!");}catch{prompt("Copy this link", txt);}};

const params = new URLSearchParams(location.search);
const quizIdParam = params.get('quiz');
const viewParam = params.get('view'); // 'board'

const step=$('#step'), heading=$('#heading'), sub=$('#sub'), shareTop=$('#shareTop');

function needConfig(){ return (typeof firebase==='undefined') || !firebase.apps?.length; }

/* ---------- Screens ---------- */
function screenConfig(){
  heading.textContent = 'Paste Firebase Config';
  sub.textContent = 'Firebase console → Project settings → Web app (</>) → copy firebaseConfig and paste at the top of this file.';
  step.replaceChildren(el('div',{className:'stack'},[
    el('div',{className:'muted'},['Open your file and uncomment firebaseConfig + initialize lines.']),
    el('div',{className:'row'},[
      el('span',{className:'pill'},['Tip:']),
      el('span',{},['Keep Realtime Database in test mode while trying.'])
    ])
  ]));
}

function screenCreator(){
  shareTop.style.display='none';
  heading.textContent='Create your luxe quiz';
  sub.textContent='Nickname set karo aur 20 choices answer karo.';
  const name=el('input',{type:'text',placeholder:'Your nickname (e.g., Homelander)'});
  const start=el('button',{className:'btn'},['Start']);
  step.replaceChildren(el('div',{className:'grid fade'},[
    el('div',{className:'stack'},[
      el('div',{className:'pill'},['Step 1']),
      el('h3',{},['Set your nickname']),
      name,
      start,
      el('div',{className:'muted'},['Default 20 questions listed.'])
    ]),
    el('div',{className:'stack'},[
      el('div',{className:'pill'},['Heads up']),
      el('div',{className:'muted'},['After finishing, you’ll get a sharable link. Friends answer → your scoreboard updates live.'])
    ])
  ]));
  start.onclick=()=> startCreator(name.value.trim()||'Friend');
}

function startCreator(nick){
  let i=0; const answers=Array(20).fill(null);
  const render=()=>{
    shareTop.style.display='none';
    heading.textContent=`Q${i+1} of 20`;
    sub.textContent= nick + ' — choose one';
    const q=Q20[i];
    const A=card(q.A, answers[i]==='A');
    const B=card(q.B, answers[i]==='B');
    A.onclick=()=>{answers[i]='A'; next()};
    B.onclick=()=>{answers[i]='B'; next()};
    step.replaceChildren(el('div',{className:'q fade'},[
      el('h3',{},[q.t(nick)]),
      el('div',{className:'opt'},[A,B]),
      el('div',{className:'row'},[
        el('span',{className:'pill'},[`Nick: ${nick}`]),
        el('span',{className:'pill'},[`Answered ${answers.filter(Boolean).length}/20`])
      ])
    ]));
  };
  const card=(opt, active)=> el('div',{className:'choice'+(active?' sel':'')},[
    el('img',{src:opt.img,alt:''}),
    el('div',{className:'cap'},[
      el('div',{className:'l'},[opt.label]),
      el('div',{className:'r'},[el('span',{className:'badge'},['Tap to choose'])])
    ])
  ]);

  const next=()=>{ if(i<19){ i++; render(); } else finish(); };

  const finish=async()=>{
    heading.textContent='Generating your link…'; sub.textContent='Please wait…';
    const quizRef = firebase.database().ref('quizzes').push();
    const quizId = quizRef.key;
    await quizRef.set({nick, answers, createdAt: Date.now(), ver:2});
    const base = location.href.split('?')[0];
    const link = `${base}?quiz=${quizId}`;
    const board = `${base}?quiz=${quizId}&view=board`;
    shareTop.onclick=()=>copy(link); shareTop.style.display='inline-flex';
    heading.textContent='Share your quiz';
    sub.textContent='Send link to friends. Their scores will appear below.';
    step.replaceChildren(el('div',{className:'stack fade'},[
      el('div',{className:'glass pad'},[
        el('div',{className:'muted'},['Quiz link:']),
        el('div',{style:'word-break:break-all'},[link]),
        el('div',{className:'row',style:'margin-top:10px'},[
          el('button',{className:'btn',onclick:()=>copy(link)},['Copy link']),
          el('button',{className:'btn outline',onclick:()=>openBoard(quizId,nick)},['Open my scoreboard'])
        ]),
        el('div',{className:'muted',style:'margin-top:8px'},['Scoreboard (only you): ', board])
      ])
    ]));
  };
  render();
}

async function screenTaker(quizId){
  const snap = await firebase.database().ref('quizzes/'+quizId).get();
  const quiz = snap.val();
  if(!quiz){ heading.textContent='Invalid link'; sub.textContent='Quiz not found.'; step.textContent=''; return; }
  const {nick, answers:correct} = quiz;
  shareTop.style.display='inline-flex';
  shareTop.onclick=()=>copy(location.href.split('&view=board')[0]);

  let i=0; const answers=Array(20).fill(null);
  const render=()=>{
    heading.textContent=`Quiz for ${nick}`; sub.textContent='Guess the choices!';
    const q=Q20[i];
    const A=card(q.A, answers[i]==='A');
    const B=card(q.B, answers[i]==='B');
    A.onclick=()=>{answers[i]='A'; next()}; B.onclick=()=>{answers[i]='B'; next()};
    step.replaceChildren(el('div',{className:'q fade'},[
      el('h3',{},[q.t(nick)]),
      el('div',{className:'opt'},[A,B]),
      el('div',{className:'row'},[
        el('span',{className:'pill'},[`Q ${i+1}/20`]),
        el('span',{className:'pill'},[`For: ${nick}`])
      ])
    ]));
  };
  const card=(opt, active)=> el('div',{className:'choice'+(active?' sel':'')},[
    el('img',{src:opt.img,alt:''}),
    el('div',{className:'cap'},[el('div',{className:'l'},[opt.label]), el('div',{className:'r'},[el('span',{className:'badge'},['Pick'])])])
  ]);
  const next=()=>{ if(i<19){i++; render()} else finish(); };

  const finish=async()=>{
    let score=0; for(let j=0;j<20;j++) if(answers[j]===correct[j]) score++;
    heading.textContent='Your score';
    sub.textContent='How much you know '+nick+'?';
    const your=el('input',{type:'text',placeholder:'Your nickname (e.g., Rocky)'});
    const send=el('button',{className:'btn'},['Save & view scoreboard']);
    send.onclick = async ()=>{
      const by=(your.value||'Friend').trim();
      await firebase.database().ref(`scoreboards/${quizId}`).push({by, score, at: Date.now()});
      openBoard(quizId,nick);
    };
    step.replaceChildren(el('div',{className:'center stack fade'},[
      el('div',{className:'score',style:`color:${score>=15?'var(--good)':score>=9?'var(--warn)':'var(--bad)'}`},[`${score} / 20`]),
      el('div',{className:'muted'},['Enter your name to record score:']),
      el('div',{className:'row'},[your, send]),
      el('div',{className:'row'},[
        el('button',{className:'btn outline',onclick:()=>screenCreator()},['Create my own quiz'])
      ])
    ]));
  };
  render();
}

async function openBoard(quizId, nick){
  heading.textContent=(nick?`${nick}'s `:'')+'Scoreboard';
  sub.textContent='Friends who answered this quiz.';
  shareTop.style.display='inline-flex';
  const base = location.href.split('?')[0];
  const share = `${base}?quiz=${quizId}`;
  shareTop.onclick=()=>copy(share);

  const listWrap=el('div',{className:'list fade'});
  step.replaceChildren(el('div',{},[
    el('div',{className:'row'},[
      el('span',{className:'pill'},[`Quiz ID: ${quizId}`]),
      el('button',{className:'btn',onclick:()=>copy(share)},['Copy quiz link'])
    ]),
    listWrap
  ]));
  const ref = firebase.database().ref(`scoreboards/${quizId}`);
  ref.on('value',(snap)=>{
    const data = snap.val() || {};
    const rows = Object.values(data);
    listWrap.replaceChildren(
      rows.length ? el('div',{}, rows.sort((a,b)=>b.at-a.at).map(r=> el('div',{className:'li'},[
        el('div',{},[r.by||'Friend']), el('div',{className:'tag'},[`${r.score}/20`])
      ]))) : el('div',{className:'pad muted'},['No entries yet. Share your link!'])
    );
  });
}

/* ---------- App start ---------- */
(function init(){
  if(needConfig()){ screenConfig(); return; }
  const quiz=quizIdParam;
  if(quiz && viewParam==='board'){ openBoard(quiz); return; }
  if(quiz){ screenTaker(quiz); return; }
  screenCreator();
})();
</script>
